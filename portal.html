<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>UGD · Redirigiendo</title>
  <script>
    // El portal ahora es una sola página. Conserva la consulta territorial y
    // traduce las anclas antiguas a las nuevas secciones.
    (function(){
      var legacy={institucion:'la-ugd',cobertura:'presencia',
        documentos:'inicio',convenios:'inicio',observatorio:'inicio',modelo:'inicio',informacion:'inicio'};
      var hash=location.hash.slice(1),target=legacy[hash]||hash;
      location.replace('./index.html'+location.search+(target?'#'+target:''));
    })();
  </script>
  <link rel="canonical" href="./index.html">
</head>
<body>
  <p><a href="./index.html">Ir al portal de la UGD</a></p>
</body>
</html>
