name: Validación
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ugd-portal-dist
          path: dist/
          include-hidden-files: true
          retention-days: 7
